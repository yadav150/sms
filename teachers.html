<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teachers · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="teachers.html" class="active">Teachers</a>
      <a href="attendance.html">Attendance</a>
      <a href="fees.html">Fees</a>
      <a href="salary.html">Salary</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="page-header">
      <h1>Teachers</h1>
      <button class="btn btn-primary" id="openTeacherModal">Add Teacher</button>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Subject</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="teacherTableBody">
            <tr>
              <td colspan="4" class="text-center">No teachers added yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Consistent Add/Edit Modal -->
    <div class="modal-overlay" id="teacherModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="teacherModalTitle">Add Teacher</h3>
          <button class="close-btn" id="closeTeacherModal">&times;</button>
        </div>
        <form id="teacherForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="tName" placeholder="Mr. Sharma" required />
            </div>
            <div class="form-group">
              <label>Subject</label>
              <input type="text" id="tSubject" placeholder="Mathematics" required />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="tPhone" placeholder="9876543210" />
            </div>
          </div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary" id="teacherSubmitBtn">Save Teacher</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="teachers.js"></script>
</body>
</html>
