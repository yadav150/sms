<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salary · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="teachers.html">Teachers</a>
      <a href="attendance.html">Attendance</a>
      <a href="fees.html">Fees</a>
      <a href="salary.html" class="active">Salary</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="page-header">
      <h1>Salary Records</h1>
      <button class="btn btn-primary" id="openSalaryModal">Add Salary</button>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Teacher</th>
              <th>Amount</th>
              <th>Month</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="salaryTableBody">
            <tr>
              <td colspan="5" class="text-center">No salary records.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Consistent Add/Edit Modal -->
    <div class="modal-overlay" id="salaryModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="salaryModalTitle">Add Salary</h3>
          <button class="close-btn" id="closeSalaryModal">&times;</button>
        </div>
        <form id="salaryForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Teacher</label>
              <select id="salaryTeacher" required></select>
            </div>
            <div class="form-group">
              <label>Amount</label>
              <input type="number" id="salaryAmount" placeholder="35000" required />
            </div>
            <div class="form-group">
              <label>Month</label>
              <input type="text" id="salaryMonth" placeholder="August" required />
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="salaryStatus">
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary" id="salarySubmitBtn">Save Salary</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="salary.js"></script>
</body>
</html>
