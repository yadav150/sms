<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salary · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        Dashboard
      </a>
      <a href="students.html">
        <svg viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Students
      </a>
      <a href="teachers.html">
        <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Teachers
      </a>
      <a href="attendance.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Attendance
      </a>
      <a href="fees.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7H7M17 12H7M17 17H7"/><rect x="2" y="2" width="20" height="20" rx="2"/></svg>
        Fees
      </a>
      <a href="salary.html" class="active">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Salary
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Page Header -->
    <div class="page-header">
      <h1>Salary Records</h1>
      <button class="btn btn-primary" id="openSalaryModal">Add Salary</button>
    </div>

    <!-- Salary Table -->
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Teacher</th>
              <th>Amount</th>
              <th>Month</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="salaryTableBody">
            <tr>
              <td colspan="5" class="text-center">No salary records.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Salary Modal -->
    <div class="modal-overlay" id="salaryModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Add Salary</h3>
          <button class="close-btn" id="closeSalaryModal">&times;</button>
        </div>
        <form id="salaryForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Teacher</label>
              <select id="salaryTeacher" required></select>
            </div>
            <div class="form-group">
              <label>Amount</label>
              <input type="number" id="salaryAmount" placeholder="35000" required />
            </div>
            <div class="form-group">
              <label>Month</label>
              <input type="text" id="salaryMonth" placeholder="August" required />
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="salaryStatus">
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary">Save Salary</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { loadSalaries, saveSalary, removeSalary, loadTeachers } from './script.js';

    const tbody = document.getElementById('salaryTableBody');
    const modal = document.getElementById('salaryModal');
    const form = document.getElementById('salaryForm');
    const teacherSelect = document.getElementById('salaryTeacher');

    // Open modal
    document.getElementById('openSalaryModal').onclick = () => {
      // Populate teacher dropdown
      loadTeachers((teachers) => {
        if (!teachers || teachers.length === 0) {
          teacherSelect.innerHTML = '<option value="">No teachers found. Add a teacher first.</option>';
        } else {
          teacherSelect.innerHTML = teachers
            .map((t) => `<option value="${t.id}">${t.name}</option>`)
            .join('');
        }
      });
      modal.classList.add('open');
    };

    // Close modal (X button)
    document.getElementById('closeSalaryModal').onclick = () => {
      modal.classList.remove('open');
    };

    // Close modal (click outside)
    modal.onclick = (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
      }
    };

    // Load and display salaries in real-time
    loadSalaries((salaries) => {
      if (!salaries || salaries.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="text-center">No salary records.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = salaries
        .map(
          (s) => `
          <tr>
            <td>${s.teacherName || s.teacherId || ''}</td>
            <td>${s.amount || ''}</td>
            <td>${s.month || ''}</td>
            <td>${s.status || 'Pending'}</td>
            <td>
              <button class="btn btn-danger" data-id="${s.id}">Delete</button>
            </td>
          </tr>
        `
        )
        .join('');

      // Attach delete events
      document.querySelectorAll('[data-id]').forEach((btn) => {
        btn.onclick = () => {
          if (confirm('Delete this salary record?')) {
            removeSalary(btn.dataset.id);
          }
        };
      });
    });

    // Handle form submission (Add Salary)
    form.onsubmit = async (e) => {
      e.preventDefault();

      const teacherId = teacherSelect.value;
      const amount = document.getElementById('salaryAmount').value;
      const month = document.getElementById('salaryMonth').value.trim();
      const status = document.getElementById('salaryStatus').value;

      if (!teacherId) {
        alert('Please select a teacher.');
        return;
      }

      if (!amount || !month) {
        alert('Amount and Month are required.');
        return;
      }

      // Fetch teacher name for display
      let teacherName = '';
      await new Promise((resolve) => {
        loadTeachers((teachers) => {
          const found = teachers.find((t) => t.id === teacherId);
          teacherName = found ? found.name : teacherId;
          resolve();
        });
      });

      await saveSalary({ teacherId, teacherName, amount, month, status });

      form.reset();
      modal.classList.remove('open');
    };
  </script>
</body>
</html>
