<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        Dashboard
      </a>
      <a href="students.html">
        <svg viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Students
      </a>
      <a href="teachers.html">
        <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Teachers
      </a>
      <a href="attendance.html" class="active">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Attendance
      </a>
      <a href="fees.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7H7M17 12H7M17 17H7"/><rect x="2" y="2" width="20" height="20" rx="2"/></svg>
        Fees
      </a>
      <a href="salary.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Salary
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Page Header -->
    <div class="page-header">
      <h1>Attendance</h1>
    </div>

    <!-- Filter Card -->
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label>Type</label>
          <select id="attType">
            <option value="students">Students</option>
            <option value="teachers">Teachers</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="attDate" />
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <button class="btn btn-primary" id="loadAttendanceBtn">Load / Refresh</button>
        </div>
      </div>
    </div>

    <!-- Attendance List Card -->
    <div class="card">
      <div id="attendanceListContainer">
        <p class="text-center">Select type, date and click "Load".</p>
      </div>
      <div class="flex mt-2">
        <button class="btn btn-success" id="saveAttendanceBtn">Save Attendance</button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import {
      loadAllStudentsForAttendance,
      loadAllTeachersForAttendance,
      getAttendance,
      markAttendance
    } from './script.js';

    const attType = document.getElementById('attType');
    const attDate = document.getElementById('attDate');
    const container = document.getElementById('attendanceListContainer');
    const loadBtn = document.getElementById('loadAttendanceBtn');
    const saveBtn = document.getElementById('saveAttendanceBtn');

    // Set default date to today
    attDate.value = new Date().toISOString().split('T')[0];

    let currentList = []; // holds {id, name, present: bool}

    function renderList(list) {
      if (!list || list.length === 0) {
        container.innerHTML = '<p class="text-center">No records found for this type.</p>';
        return;
      }

      container.innerHTML = list
        .map(
          (item) => `
          <div style="display:flex; align-items:center; gap:1rem; padding:0.5rem 0; border-bottom:1px solid #e5e7eb;">
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; width:100%;">
              <input type="checkbox" ${item.present ? 'checked' : ''} data-id="${item.id}" style="width:18px; height:18px;" />
              <span>${item.name}</span>
            </label>
          </div>
        `
        )
        .join('');

      // Update current list when checkbox changes
      document.querySelectorAll('#attendanceListContainer input[type="checkbox"]').forEach((cb) => {
        cb.onchange = () => {
          const found = currentList.find((i) => i.id === cb.dataset.id);
          if (found) found.present = cb.checked;
        };
      });
    }

    async function loadAttendance() {
      const type = attType.value;
      const date = attDate.value;

      if (!date) {
        alert('Please select a date.');
        return;
      }

      let people = [];

      if (type === 'students') {
        await new Promise((resolve) => {
          loadAllStudentsForAttendance((data) => {
            people = data;
            resolve();
          });
        });
      } else {
        await new Promise((resolve) => {
          loadAllTeachersForAttendance((data) => {
            people = data;
            resolve();
          });
        });
      }

      if (!people || people.length === 0) {
        container.innerHTML = `<p class="text-center">No ${type} added yet. Please add some first.</p>`;
        currentList = [];
        return;
      }

      // Fetch existing attendance for this date
      getAttendance(type, date, (attData) => {
        currentList = people.map((p) => ({
          id: p.id,
          name: p.name || 'Unnamed',
          present: attData && attData[p.id] === true
        }));
        renderList(currentList);
      });
    }

    // Load button click
    loadBtn.onclick = loadAttendance;

    // Save button click
    saveBtn.onclick = async () => {
      const type = attType.value;
      const date = attDate.value;

      if (!date) {
        alert('Select date.');
        return;
      }

      if (currentList.length === 0) {
        alert('No data to save.');
        return;
      }

      const map = {};
      currentList.forEach((item) => {
        map[item.id] = !!item.present;
      });

      await markAttendance(type, date, map);
      alert(`Attendance for ${date} saved successfully!`);
    };

    // Auto-load on page open
    setTimeout(loadAttendance, 300);
  </script>
</body>
</html>
