<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fees · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        Dashboard
      </a>
      <a href="students.html">
        <svg viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Students
      </a>
      <a href="teachers.html">
        <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Teachers
      </a>
      <a href="attendance.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Attendance
      </a>
      <a href="fees.html" class="active">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7H7M17 12H7M17 17H7"/><rect x="2" y="2" width="20" height="20" rx="2"/></svg>
        Fees
      </a>
      <a href="salary.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Salary
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Page Header -->
    <div class="page-header">
      <h1>Fee Records</h1>
      <button class="btn btn-primary" id="openFeeModal">Add Fee</button>
    </div>

    <!-- Fee Table -->
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Amount</th>
              <th>Month</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="feeTableBody">
            <tr>
              <td colspan="5" class="text-center">No fee records.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Fee Modal -->
    <div class="modal-overlay" id="feeModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Add Fee</h3>
          <button class="close-btn" id="closeFeeModal">&times;</button>
        </div>
        <form id="feeForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Student</label>
              <select id="feeStudent" required></select>
            </div>
            <div class="form-group">
              <label>Amount</label>
              <input type="number" id="feeAmount" placeholder="5000" required />
            </div>
            <div class="form-group">
              <label>Month</label>
              <input type="text" id="feeMonth" placeholder="August" required />
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="feeStatus">
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary">Save Fee</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { loadFees, saveFee, removeFee, loadStudents } from './script.js';

    const tbody = document.getElementById('feeTableBody');
    const modal = document.getElementById('feeModal');
    const form = document.getElementById('feeForm');
    const studentSelect = document.getElementById('feeStudent');

    // Open modal
    document.getElementById('openFeeModal').onclick = () => {
      // Populate student dropdown
      loadStudents((students) => {
        if (!students || students.length === 0) {
          studentSelect.innerHTML = '<option value="">No students found. Add a student first.</option>';
        } else {
          studentSelect.innerHTML = students
            .map((s) => `<option value="${s.id}">${s.name}</option>`)
            .join('');
        }
      });
      modal.classList.add('open');
    };

    // Close modal (X button)
    document.getElementById('closeFeeModal').onclick = () => {
      modal.classList.remove('open');
    };

    // Close modal (click outside)
    modal.onclick = (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
      }
    };

    // Load and display fees in real-time
    loadFees((fees) => {
      if (!fees || fees.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="text-center">No fee records.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = fees
        .map(
          (f) => `
          <tr>
            <td>${f.studentName || f.studentId || ''}</td>
            <td>${f.amount || ''}</td>
            <td>${f.month || ''}</td>
            <td>${f.status || 'Pending'}</td>
            <td>
              <button class="btn btn-danger" data-id="${f.id}">Delete</button>
            </td>
          </tr>
        `
        )
        .join('');

      // Attach delete events
      document.querySelectorAll('[data-id]').forEach((btn) => {
        btn.onclick = () => {
          if (confirm('Delete this fee record?')) {
            removeFee(btn.dataset.id);
          }
        };
      });
    });

    // Handle form submission (Add Fee)
    form.onsubmit = async (e) => {
      e.preventDefault();

      const studentId = studentSelect.value;
      const amount = document.getElementById('feeAmount').value;
      const month = document.getElementById('feeMonth').value.trim();
      const status = document.getElementById('feeStatus').value;

      if (!studentId) {
        alert('Please select a student.');
        return;
      }

      if (!amount || !month) {
        alert('Amount and Month are required.');
        return;
      }

      // Fetch student name for display
      let studentName = '';
      await new Promise((resolve) => {
        loadStudents((students) => {
          const found = students.find((s) => s.id === studentId);
          studentName = found ? found.name : studentId;
          resolve();
        });
      });

      await saveFee({ studentId, studentName, amount, month, status });

      form.reset();
      modal.classList.remove('open');
    };
  </script>
</body>
</html>
