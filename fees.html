<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fees · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="teachers.html">Teachers</a>
      <a href="attendance.html">Attendance</a>
      <a href="fees.html" class="active">Fees</a>
      <a href="salary.html">Salary</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="page-header">
      <h1>Fee Records</h1>
      <button class="btn btn-primary" id="openFeeModal">Add Fee</button>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Amount</th>
              <th>Month</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="feeTableBody">
            <tr>
              <td colspan="5" class="text-center">No fee records.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Consistent Add/Edit Modal -->
    <div class="modal-overlay" id="feeModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="feeModalTitle">Add Fee</h3>
          <button class="close-btn" id="closeFeeModal">&times;</button>
        </div>
        <form id="feeForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Student</label>
              <select id="feeStudent" required></select>
            </div>
            <div class="form-group">
              <label>Amount</label>
              <input type="number" id="feeAmount" placeholder="5000" required />
            </div>
            <div class="form-group">
              <label>Month</label>
              <input type="text" id="feeMonth" placeholder="August" required />
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="feeStatus">
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary" id="feeSubmitBtn">Save Fee</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="fees.js"></script>
</body>
</html>
