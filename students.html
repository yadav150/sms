<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        Dashboard
      </a>
      <a href="students.html" class="active">
        <svg viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Students
      </a>
      <a href="teachers.html">
        <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Teachers
      </a>
      <a href="attendance.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Attendance
      </a>
      <a href="fees.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7H7M17 12H7M17 17H7"/><rect x="2" y="2" width="20" height="20" rx="2"/></svg>
        Fees
      </a>
      <a href="salary.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Salary
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Page Header -->
    <div class="page-header">
      <h1>Students</h1>
      <button class="btn btn-primary" id="openStudentModal">Add Student</button>
    </div>

    <!-- Student Table -->
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Class</th>
              <th>Phone</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <tr>
              <td colspan="4" class="text-center">No students added yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Student Modal -->
    <div class="modal-overlay" id="studentModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Add Student</h3>
          <button class="close-btn" id="closeStudentModal">&times;</button>
        </div>
        <form id="studentForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="sName" placeholder="Rahul Kumar" required />
            </div>
            <div class="form-group">
              <label>Class</label>
              <input type="text" id="sClass" placeholder="10-A" required />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="sPhone" placeholder="9876543210" />
            </div>
          </div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary">Save Student</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { loadStudents, saveStudent, removeStudent } from './script.js';

    const tbody = document.getElementById('studentTableBody');
    const modal = document.getElementById('studentModal');
    const form = document.getElementById('studentForm');

    // Open modal
    document.getElementById('openStudentModal').onclick = () => {
      modal.classList.add('open');
    };

    // Close modal (X button)
    document.getElementById('closeStudentModal').onclick = () => {
      modal.classList.remove('open');
    };

    // Close modal (click outside)
    modal.onclick = (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
      }
    };

    // Load and display students in real-time
    loadStudents((students) => {
      if (!students || students.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center">No students added yet.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = students
        .map(
          (s) => `
          <tr>
            <td>${s.name || ''}</td>
            <td>${s.class || ''}</td>
            <td>${s.phone || ''}</td>
            <td>
              <button class="btn btn-danger" data-id="${s.id}">Delete</button>
            </td>
          </tr>
        `
        )
        .join('');

      // Attach delete events to all delete buttons
      document.querySelectorAll('[data-id]').forEach((btn) => {
        btn.onclick = () => {
          if (confirm('Delete this student?')) {
            removeStudent(btn.dataset.id);
          }
        };
      });
    });

    // Handle form submission (Add Student)
    form.onsubmit = async (e) => {
      e.preventDefault();

      const name = document.getElementById('sName').value.trim();
      const cls = document.getElementById('sClass').value.trim();
      const phone = document.getElementById('sPhone').value.trim();

      if (!name || !cls) {
        alert('Name and Class are required.');
        return;
      }

      await saveStudent({ name, class: cls, phone });

      form.reset();
      modal.classList.remove('open');
    };
  </script>
</body>
</html>
