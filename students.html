<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students · School ERP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">SchoolERP</div>
    <nav>
      <a href="index.html"> Dashboard </a>
      <a href="students.html" class="active"> Students </a>
      <a href="teachers.html"> Teachers </a>
      <a href="attendance.html"> Attendance </a>
      <a href="fees.html"> Fees </a>
      <a href="salary.html"> Salary </a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="page-header">
      <h1>Students</h1>
      <button class="btn btn-primary" id="openStudentModal">Add Student</button>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Class</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <tr>
              <td colspan="4" class="text-center">No students added yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Consistent Add/Edit Modal -->
    <div class="modal-overlay" id="studentModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="studentModalTitle">Add Student</h3>
          <button class="close-btn" id="closeStudentModal">&times;</button>
        </div>
        <form id="studentForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="sName" placeholder="Rahul Kumar" required />
            </div>
            <div class="form-group">
              <label>Class</label>
              <input type="text" id="sClass" placeholder="10-A" required />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="sPhone" placeholder="9876543210" />
            </div>
          </div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary" id="studentSubmitBtn">Save Student</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer">Yadav Web Technologies</footer>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="students.js"></script>
</body>
</html>
